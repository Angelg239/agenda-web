<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banderas con SVG</title>
    <style>
        svg{
            box-shadow: inset 2px 2px 6px 5px rgb(91, 90, 90);
        }
    </style>
</head>
<body>
    <header>
        <h1>Banderas del mundo con vectores SVG</h1>
    </header>
    <main>
        <section>
            <div class="bandera">
                <h2>Francia</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="2" height="4" x="0" y="0" fill="#0000ff" />
                    <rect width="2" height="4" x="2" y="0" fill="#ffffff" />
                    <rect width="2" height="4" x="4" y="0" fill="#ff0000" />
                </svg>
            </div>
            <div class="bandera">
                <h2>Holanda</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="2" x="0" y="0" fill="#AE1C28" />
                    <rect width="9" height="2" x="0" y="2" fill="#ffffff" />
                    <rect width="9" height="2" x="0" y="4" fill="#21468B" />
                </svg>
            </div>
            <div class="bandera">
                <h2>Colombia</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="3" x="0" y="0" fill="#FCD116" />
                    <rect width="9" height="1.5" x="0" y="3" fill="#003893" />
                    <rect width="9" height="1.5" x="0" y="4.5" fill="#CE1126" />
                </svg>
            <div class="bandera">
                <h2>Japon</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="6" x="0" y="0" fill="#ffffff" />
                    <circle cx="4.5" cy="3" r="1.8" fill="#BC002D" />
                </svg>
            </div>
            <div class="bandera">
                <h2>Suiza</h2>
                <svg width="150" height="100" viewBox="0 0 32 32">
                    <rect width="32" height="32" fill="#D52B1E"/>
                    <rect x="13" y="6" width="6" height="20" fill="#FFFFFF"/>
                    <rect x="6" y="13" width="20" height="6" fill="#FFFFFF"/>
                </svg>
            </div>
            <div class="bandera">
                <h2>Estrella</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="4" x="0" y="0" fill="#cd212a" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 
                                    0.8817,-1.2135 0.0000,-0.6000 
                                    -0.8817,-1.2135 -0.5706,-0.1854 
                                    -1.42660,0.4635 -0.3527,0.4854 
                                    0.0000,1.5000 0.3527,0.4854" 
                            fill="white" transform="translate(3 2) rotate(36)" />
                </svg>
            </div>
            <div class="bandera">
                <h2>Chile</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="4" x="0" y="0" fill="#D52B1E" />
                    <rect width="2" height="2" x="0" y="0" fill="#0039A6" />
                    <rect width="4" height="2" x="2" y="0" fill="#ffffff" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 
                                    0.8817,-1.2135 0.0000,-0.6000 
                                    -0.8817,-1.2135 -0.5706,-0.1854 
                                    -1.42660,0.4635 -0.3527,0.4854 
                                    0.0000,1.5000 0.3527,0.4854" 
                            fill="white" transform="translate(1 1) scale(.5) rotate(36)" />
                </svg>
            </div>
            <div class="bandera">
                <h2>Peru</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="2" height="4" x="0" y="0" fill="#D52B1E" />
                    <rect width="2" height="4" x="2" y="0" fill="#ffffff" />
                    <rect width="2" height="4" x="4" y="0" fill="#D52B1E" />
                </svg>
            </div>
            <div class="bandera">
                <h2>China</h2>
                <svg width="150" height="100" viewBox="0 0 6 4">
                    <rect width="6" height="4" x="0" y="0" fill="#DE2910" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 0.8817,-1.2135 0.0000,-0.6000 -0.8817,-1.2135 -0.5706,-0.1854 -1.4266,0.4635 -0.3527,0.4854 0.0000,1.5000 0.3527,0.4854" fill="#FFDE00" transform="translate(1.2 1.2) scale(0.6)" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 0.8817,-1.2135 0.0000,-0.6000 -0.8817,-1.2135 -0.5706,-0.1854 -1.4266,0.4635 -0.3527,0.4854 0.0000,1.5000 0.3527,0.4854" fill="#FFDE00" transform="translate(2.2 0.6) scale(0.25) rotate(-20)" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 0.8817,-1.2135 0.0000,-0.6000 -0.8817,-1.2135 -0.5706,-0.1854 -1.4266,0.4635 -0.3527,0.4854 0.0000,1.5000 0.3527,0.4854" fill="#FFDE00" transform="translate(2.6 1.2) scale(0.25) rotate(15)" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 0.8817,-1.2135 0.0000,-0.6000 -0.8817,-1.2135 -0.5706,-0.1854 -1.4266,0.4635 -0.3527,0.4854 0.0000,1.5000 0.3527,0.4854" fill="#FFDE00" transform="translate(2.6 1.9) scale(0.25) rotate(40)" />
                    <polygon points="1.4266,0.4635 0.5706,-0.1854 0.8817,-1.2135 0.0000,-0.6000 -0.8817,-1.2135 -0.5706,-0.1854 -1.4266,0.4635 -0.3527,0.4854 0.0000,1.5000 0.3527,0.4854" fill="#FFDE00" transform="translate(2.2 2.5) scale(0.25) rotate(15)" />
                </svg>
            </div>
            <div class="bandera">
                <h2>Estonia</h2>
                <svg width="150" height="100" viewBox="0 0 9 6">
                    <rect width="9" height="2" x="0" y="0" fill="#0072CE" />
                    <rect width="9" height="2" x="0" y="2" fill="#000000" />
                    <rect width="9" height="2" x="0" y="4" fill="#FFFFFF" />
                </svg>
            </div>
        </section>
    </main>
    <footer>
        <p>Todos los derechos reservados &copy;</p>
    </footer>
</body>
</html>
